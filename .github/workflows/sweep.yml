name: Sweep and publish

on:
  schedule:
    # Every hour, on the hour (GitHub cron is UTC; public repos get free, unlimited Actions minutes).
    - cron: "0 * * * *"
  workflow_dispatch: {}   # "Run workflow" button = manual sweep
  push:
    branches: [main]
    paths: ["docs/**", "!docs/data/**", "scraper/**", "requirements.txt", ".github/workflows/sweep.yml"]

permissions:
  contents: write   # commit updated data
  pages: write      # publish the site
  id-token: write   # required by deploy-pages

concurrency:
  group: wntr-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WNTR_TIME_BUDGET: "180"
      WNTR_NOMINATIM_CAP: "10"
      WNTR_LINKCHECK_CAP: "25"
      WNTR_SKY_CAP: "300"
      WNTR_SKY_BUDGET: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Cache Sky Check data (ephemeris, orbit data, launches)
        uses: actions/cache@v4
        with:
          path: .cache/sky
          key: sky-data-${{ github.run_id }}
          restore-keys: sky-data-
      - name: Sweep public sources (no AI, no keys)
        run: python scraper/sweep.py
      - name: Commit updated archive
        run: |
          git config user.name "wntr-sweep-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sweep $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
      - name: Package site
        run: |
          rm -rf _site && cp -r docs _site
          mkdir -p _site/_state && cp state/* _site/_state/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: sweep
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
