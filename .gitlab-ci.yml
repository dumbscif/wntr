# UFO Sighting Archive: WNTR - free GitLab version (no AI, no keys).
# Sweeps run from a pipeline schedule (set to 4 AM and 4 PM America/Denver),
# or by clicking "Run pipeline". Each run picks up the previous archive from the
# live Pages site, so nothing has to be committed back to the repo.
# Free plan = 400 compute minutes/month. A sweep is time-boxed (WNTR_TIME_BUDGET) and pip is cached,
# so each run takes ~2-3 minutes; twice a day is ~150-180 minutes a month.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  WNTR_TIME_BUDGET: "180"
  WNTR_NOMINATIM_CAP: "10"
  WNTR_LINKCHECK_CAP: "25"
  WNTR_SKY_CAP: "300"
  WNTR_SKY_BUDGET: "120"
  GIT_DEPTH: "1"

pages:
  image: python:3.12-slim
  interruptible: true
  resource_group: pages
  cache:
    - key: pip-py312-v2
      paths:
        - .cache/pip
    # Sky Check data: JPL ephemeris (17 MB, downloaded once), CelesTrak orbit data + SATCAT and Launch Library 2 results
    # (re-downloaded at most every ~10-12 h by the script itself)
    - key: sky-data-v1
      paths:
        - .cache/sky
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 10 minutes
  script:
    - pip install -q -r requirements.txt
    - |
      python - <<'PY'
      import os, urllib.request
      base = os.environ.get("CI_PAGES_URL", "").rstrip("/")
      targets = {"data/events.json": "docs/data/events.json",
                 "data/excluded.json": "docs/data/excluded.json",
                 "_state/geocache.json": "state/geocache.json",
                 "_state/sweep-log.jsonl": "state/sweep-log.jsonl"}
      for rel, dest in targets.items():
          if not base:
              break
          try:
              req = urllib.request.Request(f"{base}/{rel}", headers={"User-Agent": "wntr-sweep"})
              body = urllib.request.urlopen(req, timeout=20).read()
              if rel.endswith("events.json") and len(body) < 1000:
                  continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              open(dest, "wb").write(body)
              print("restored", rel, len(body), "bytes")
          except Exception as e:
              print("no previous", rel, "-", e, "(using copy in repo)")
      PY
    - python scraper/sweep.py
    - rm -rf public && cp -r docs public && mkdir -p public/_state && cp state/* public/_state/
  artifacts:
    paths:
      - public
    expire_in: never
